name: flyers
on:
  schedule:
    - cron: "15 21 * * *"   # 6:15 JST
    - cron: "15 0 * * *"    # 9:15 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/flyers.yml", "_flyer/**"]
permissions:
  contents: write
concurrency: flyers
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch flyer images
        run: python3 _flyer/fetch.py "$RUNNER_TEMP/out"
      - name: Publish to flyers branch
        run: |
          cd "$RUNNER_TEMP/out"
          git init -q -b flyers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Flyers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" flyers
